<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Success</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f6f7f2;
        color: #17211b;
      }

      main {
        width: min(92vw, 560px);
        border: 1px solid #d9decf;
        background: #fffef9;
        padding: 32px;
        border-radius: 8px;
        box-shadow: 0 18px 55px rgb(23 33 27 / 12%);
      }

      a {
        color: #146c5f;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Payment received</h1>
      <p>Stripe sent you back after Checkout. The backend will mark the payment as paid when the Stripe webhook arrives.</p>
      <a href="/">Back to portal</a>
    </main>
  </body>
</html>
